# Homework-website-v2
For Class 3A CSS 2026-2027 version 2
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homework Hub — Earn Points, Beat Your Friends</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2437;
    --muted: #7b8199;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --border: #e6e8f0;
    --good: #10b981;
    --bad: #ef4444;
    --shadow: 0 10px 30px rgba(31, 36, 55, .08);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 550px at 8% -10%, #e6e9ff 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #ffe9f3 0%, transparent 55%),
      var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap;
    padding: 14px 20px;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 800; font-size: 19px; letter-spacing: -.3px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .user-area { display: flex; align-items: center; gap: 10px; }
  #userInput {
    border: 1px solid var(--border); background: #fff; border-radius: 11px;
    padding: 9px 13px; font: inherit; font-size: 14px; width: 190px; color: var(--ink);
    outline: none; transition: .15s;
  }
  #userInput:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(99,102,241,.13); }
  .points-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 700; font-size: 13px;
    padding: 8px 14px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 6px 16px rgba(99,102,241,.32);
  }

  /* ---------- Layout ---------- */
  .layout {
    max-width: 1100px; margin: 0 auto;
    padding: 24px 20px 130px;
    display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr);
    gap: 20px; align-items: start;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    #userInput { width: 130px; }
  }

  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: var(--shadow); padding: 18px 18px 20px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .panel-head h2 { margin: 0; font-size: 17px; letter-spacing: -.2px; }
  .subtitle { font-size: 12px; color: var(--muted); font-weight: 500; }

  /* ---------- Homework list ---------- */
  .subject-group { margin-bottom: 20px; }
  .subject-group:last-child { margin-bottom: 0; }
  .subject-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--muted); margin: 0 0 8px 4px; font-weight: 700;
  }
  .subject-head .count {
    background: #eef0fa; color: var(--accent); border-radius: 999px;
    padding: 1px 8px; font-size: 11px; letter-spacing: 0;
  }
  .hw-item {
    display: flex; align-items: flex-start; gap: 12px;
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px; transition: .15s;
  }
  .hw-item:hover { border-color: #d6d9ea; box-shadow: 0 6px 18px rgba(31,36,55,.07); transform: translateY(-1px); }
  .hw-item.done { opacity: .62; }
  .hw-item.done .hw-title { text-decoration: line-through; color: var(--muted); }
  .hw-item.overdue { border-color: #fecaca; background: #fff6f6; }

  .check {
    flex: none; width: 24px; height: 24px; margin-top: 2px; border-radius: 50%;
    border: 2px solid #cbd0e0; background: transparent; color: #fff;
    font-size: 13px; line-height: 1; display: grid; place-items: center;
    cursor: pointer; transition: .15s; padding: 0;
  }
  .check:hover { border-color: var(--good); }
  .hw-item.done .check { background: var(--good); border-color: var(--good); }

  .hw-body { flex: 1; min-width: 0; }
  .hw-title { font-size: 14.5px; font-weight: 600; line-height: 1.35; word-break: break-word; }
  .hw-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: #f2f4fb; color: var(--muted); white-space: nowrap;
  }
  .chip.due { background: #eef0ff; color: #4f46e5; }
  .hw-item.overdue .chip.due { background: #fee2e2; color: #dc2626; }
  .chip.user { background: #f3f0ff; color: #7c3aed; }

  .del {
    flex: none; border: none; background: transparent; color: #c3c8d8;
    font-size: 15px; cursor: pointer; padding: 2px 4px; border-radius: 8px; transition: .15s;
  }
  .del:hover { color: var(--bad); background: #fef2f2; }

  .empty {
    text-align: center; color: var(--muted); font-size: 14px;
    padding: 40px 16px; border: 2px dashed var(--border); border-radius: 16px; line-height: 1.6;
  }

  /* ---------- Leaderboard ---------- */
  .reset-box {
    background: linear-gradient(135deg, #eef0ff, #f7efff);
    border: 1px solid #e3e5ff; border-radius: 16px;
    padding: 14px; text-align: center; margin-bottom: 14px;
  }
  .reset-box .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
  .countdown {
    font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin: 6px 0 4px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .reset-date { font-size: 11.5px; color: var(--muted); }

  .leaderboard { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .lb-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 12px; background: #fafbff;
    border: 1px solid #eff1f9; font-size: 14px; transition: .15s;
  }
  .lb-row.me {
    background: linear-gradient(135deg, #eef0ff, #faf0ff);
    border-color: #d9dcff; box-shadow: 0 4px 14px rgba(99,102,241,.14);
  }
  .rank { width: 26px; text-align: center; font-weight: 800; font-size: 14px; color: var(--muted); flex: none; }
  .lb-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-points { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .empty-lb { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 0; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 26px; bottom: 26px; z-index: 40;
    width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 32px; font-weight: 300; line-height: 1;
    display: grid; place-items: center; padding-bottom: 5px;
    box-shadow: 0 12px 28px rgba(99,102,241,.45);
    transition: .18s;
  }
  .fab:hover { transform: scale(1.07) rotate(90deg); box-shadow: 0 16px 34px rgba(99,102,241,.55); }
  .fab:active { transform: scale(.96); }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(25, 28, 45, .45); backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    background: #fff; border-radius: 22px; padding: 24px; width: 100%; max-width: 430px;
    box-shadow: 0 30px 70px rgba(20, 22, 40, .3); animation: pop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0 } to { transform: none; opacity: 1 } }
  .modal h2 { margin: 0 0 18px; font-size: 19px; }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 13px; font: inherit; font-size: 14.5px; color: var(--ink);
    outline: none; transition: .15s; background: #fbfcff;
  }
  .field input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(99,102,241,.13); }
  .reward {
    font-size: 13px; font-weight: 700; color: #059669;
    background: #ecfdf5; border: 1px solid #d1fae5;
    padding: 9px 12px; border-radius: 12px; text-align: center; margin: 4px 0 18px;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    padding: 11px 20px; border-radius: 12px; border: 1px solid transparent; transition: .15s;
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    box-shadow: 0 8px 20px rgba(99,102,241,.34);
  }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(99,102,241,.42); }
  .btn.ghost { background: #f5f6fb; color: var(--muted); border-color: var(--border); }
  .btn.ghost:hover { background: #eceef7; color: var(--ink); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 24px);
    background: #1f2437; color: #fff; font-size: 14px; font-weight: 600;
    padding: 12px 22px; border-radius: 999px; z-index: 60;
    opacity: 0; pointer-events: none; transition: .25s;
    box-shadow: 0 14px 34px rgba(20,22,40,.34);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span> Homework Hub</div>
  <div class="user-area">
    <input id="userInput" placeholder="Your name…" autocomplete="off" maxlength="18" />
    <span class="points-pill">⭐ <span id="myPoints">0</span> pts</span>
  </div>
</header>

<main class="layout">
  <!-- Homework list -->
  <section class="panel">
    <div class="panel-head">
      <h2>📋 Homework</h2>
      <span class="subtitle">Sorted by subject → due date</span>
    </div>
    <div id="homeworkList"></div>
  </section>

  <!-- Leaderboard -->
  <aside class="panel">
    <div class="panel-head">
      <h2>🏆 Leaderboard</h2>
      <span class="subtitle" id="monthLabel"></span>
    </div>

    <div class="reset-box">
      <div class="label">Resets in</div>
      <div class="countdown" id="countdown">—</div>
      <div class="reset-date" id="resetDate"></div>
    </div>

    <ol class="leaderboard" id="leaderboard"></ol>
  </aside>
</main>

<button class="fab" id="fab" title="Add homework" aria-label="Add homework">+</button>

<!-- Add homework modal -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add homework</h2>
    <form id="addForm">
      <label class="field">
        <span>Subject</span>
        <input id="subjectInput" list="subjectList" placeholder="e.g. Math" required maxlength="30" autocomplete="off" />
        <datalist id="subjectList">
          <option>Math</option><option>English</option><option>Science</option>
          <option>Biology</option><option>Chemistry</option><option>Physics</option>
          <option>History</option><option>Geography</option><option>Computer Science</option>
          <option>Art</option><option>Music</option><option>PE</option>
          <option>Language</option><option>Other</option>
        </datalist>
      </label>

      <label class="field">
        <span>Task</span>
        <input id="titleInput" placeholder="e.g. Page 42, exercises 1–10" required maxlength="90" autocomplete="off" />
      </label>

      <label class="field">
        <span>Due date</span>
        <input id="dueInput" type="date" required />
      </label>

      <p class="reward">🎉 +20 points for adding homework</p>

      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary">Add homework</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Homework Hub — all data lives in localStorage
   ========================================================= */
const STORAGE_KEY = 'homeworkHub.v1';
const POINTS_PER_ITEM = 20;

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const monthKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;

/* ---------------- State ---------------- */
let state = loadState();

function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object') s = {};

  s.users      = (s.users && typeof s.users === 'object') ? s.users : {};
  s.homework   = Array.isArray(s.homework) ? s.homework : [];
  s.currentUser = typeof s.currentUser === 'string' ? s.currentUser : '';

  Object.keys(s.users).forEach(name => {
    if (typeof s.users[name]?.points !== 'number') s.users[name] = { points: 0 };
  });

  // Monthly reset on load (e.g. page opened in a new month)
  if (s.monthKey !== monthKey()) {
    s.monthKey = monthKey();
    Object.keys(s.users).forEach(n => { s.users[n].points = 0; });
  }
  return s;
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ---------------- User ---------------- */
function commitUser() {
  const name = userInput.value.trim();
  if (!name) return false;
  if (!state.users[name]) state.users[name] = { points: 0 };
  state.currentUser = name;
  save();
  render();
  return true;
}

function addPoints(name, amount) {
  if (!state.users[name]) state.users[name] = { points: 0 };
  state.users[name].points = Math.max(0, state.users[name].points + amount);
}

/* ---------------- Homework actions ---------------- */
function addHomework(subject, title, due) {
  state.homework.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    user: state.currentUser,
    subject: subject.trim(),
    title: title.trim(),
    due,
    createdAt: Date.now(),
    done: false
  });
  addPoints(state.currentUser, POINTS_PER_ITEM);
  save();
  render();
}

function toggleDone(id) {
  const item = state.homework.find(h => h.id === id);
  if (!item) return;
  item.done = !item.done;
  save();
  render();
}

function deleteHomework(id) {
  const idx = state.homework.findIndex(h => h.id === id);
  if (idx === -1) return;
  const item = state.homework[idx];
  if (item.user !== state.currentUser) return; // only your own
  state.homework.splice(idx, 1);
  addPoints(item.user, -POINTS_PER_ITEM); // remove the reward to prevent farming
  save();
  render();
  toast('Homework removed');
}

/* ---------------- Sorting ---------------- */
function compareHomework(a, b) {
  // 1) subject (alphabetical)
  const s = a.subject.localeCompare(b.subject, undefined, { sensitivity: 'base' });
  if (s !== 0) return s;
  // 2) unfinished before finished
  if (a.done !== b.done) return a.done ? 1 : -1;
  // 3) due date (earliest first, no date last)
  const ad = a.due || '9999-12-31';
  const bd = b.due || '9999-12-31';
  if (ad !== bd) return ad < bd ? -1 : 1;
  // 4) creation time
  return a.createdAt - b.createdAt;
}

function formatDue(date) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((date - today) / 86400000);
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Tomorrow';
  if (diffDays === -1) return 'Yesterday';
  return date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

/* ---------------- Rendering ---------------- */
function render() {
  renderPointsPill();
  renderHomework();
  renderLeaderboard();
}

function renderPointsPill() {
  const pts = state.users[state.currentUser]?.points ?? 0;
  myPoints.textContent = pts;
}

function renderHomework() {
  const container = document.getElementById('homeworkList');

  if (!state.homework.length) {
    container.innerHTML = `<div class="empty">No homework yet.<br>Tap the <b>+</b> button to add your first assignment 🎉</div>`;
    return;
  }

  const sorted = [...state.homework].sort(compareHomework);

  // group by subject (already sorted)
  const groups = new Map();
  sorted.forEach(item => {
    const key = item.subject || 'Other';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });

  const today = new Date(); today.setHours(0, 0, 0, 0);
  let html = '';

  for (const [subject, list] of groups) {
    html += `<div class="subject-group">
      <h3 class="subject-head">${esc(subject)} <span class="count">${list.length}</span></h3>`;

    for (const item of list) {
      const dueDate = item.due ? new Date(item.due + 'T00:00:00') : null;
      const overdue = !!dueDate && dueDate < today && !item.done;
      const mine = item.user === state.currentUser;

      html += `<div class="hw-item ${item.done ? 'done' : ''} ${overdue ? 'overdue' : ''}">
        <button class="check" data-action="toggle" data-id="${item.id}" aria-label="Mark done">${item.done ? '✓' : ''}</button>
        <div class="hw-body">
          <div class="hw-title">${esc(item.title)}</div>
          <div class="hw-meta">
            <span class="chip due">📅 ${dueDate ? formatDue(dueDate) : 'No due date'}</span>
            <span class="chip user">👤 ${esc(item.user)}</span>
          </div>
        </div>
        ${mine ? `<button class="del" data-action="delete" data-id="${item.id}" title="Delete">✕</button>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  container.innerHTML = html;
}

function renderLeaderboard() {
  const list = document.getElementById('leaderboard');
  const rows = Object.entries(state.users)
    .map(([name, data]) => ({ name, points: data.points || 0 }))
    .sort((a, b) => b.points - a.points || a.name.localeCompare(b.name));

  if (!rows.length) {
    list.innerHTML = `<li class="empty-lb">No players yet — be the first! 🚀</li>`;
    return;
  }

  const medals = ['🥇', '🥈', '🥉'];
  list.innerHTML = rows.map((u, i) => `
    <li class="lb-row ${u.name === state.currentUser ? 'me' : ''}">
      <span class="rank">${medals[i] || (i + 1)}</span>
      <span class="lb-name">${esc(u.name)}</span>
      <span class="lb-points">${u.points}</span>
    </li>`).join('');
}

/* ---------------- Monthly countdown ---------------- */
function nextResetDate() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth() + 1, 1, 0, 0, 0, 0);
}

function tickCountdown() {
  const now = new Date();

  // If the month rolled over while the page is open → reset everyone
  if (monthKey(now) !== state.monthKey) {
    state.monthKey = monthKey();
    Object.keys(state.users).forEach(n => { state.users[n].points = 0; });
    save();
    render();
    toast('🔁 New month — leaderboard reset!');
  }

  const next = nextResetDate();
  const diff = Math.max(0, next - now);

  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff / 3600000) % 24;
  const m = Math.floor(diff / 60000) % 60;
  const s = Math.floor(diff / 1000) % 60;

  document.getElementById('countdown').textContent = `${d}d ${pad(h)}h ${pad(m)}m ${pad(s)}s`;
  document.getElementById('resetDate').textContent =
    'Resets on ' + next.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) + ' · 12:00 AM';
  document.getElementById('monthLabel').textContent =
    now.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}

/* ---------------- Toast ---------------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------- DOM wiring ---------------- */
const userInput = document.getElementById('userInput');
const overlay   = document.getElementById('overlay');
const addForm   = document.getElementById('addForm');
const subjectInput = document.getElementById('subjectInput');
const titleInput   = document.getElementById('titleInput');
const dueInput     = document.getElementById('dueInput');

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function openModal() {
  subjectInput.value = '';
  titleInput.value = '';
  dueInput.value = todayISO();
  overlay.classList.add('open');
  setTimeout(() => subjectInput.focus(), 60);
}

function closeModal() { overlay.classList.remove('open'); }

/* Name input */
userInput.value = state.currentUser;
userInput.addEventListener('change', () => {
  if (!commitUser()) toast('Enter a name to start earning points ✍️');
});
userInput.addEventListener('keydown', e => { if (e.key === 'Enter') userInput.blur(); });

/* + button */
document.getElementById('fab').addEventListener('click', () => {
  if (!commitUser()) { userInput.focus(); toast('Enter your name first ✍️'); return; }
  openModal();
});

/* Modal buttons */
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* Submit new homework */
addForm.addEventListener('submit', e => {
  e.preventDefault();
  const subject = subjectInput.value.trim();
  const title   = titleInput.value.trim();
  const due     = dueInput.value;

  if (!subject || !title || !due) return;
  if (!commitUser()) { closeModal(); userInput.focus(); return; }

  addHomework(subject, title, due);
  closeModal();
  toast(`+${POINTS_PER_ITEM} points! 🎉`);
});

/* Homework list actions (event delegation) */
document.getElementById('homeworkList').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, id } = btn.dataset;
  if (action === 'toggle') toggleDone(id);
  if (action === 'delete') deleteHomework(id);
});

/* ---------------- Start ---------------- */
render();
tickCountdown();
setInterval(tickCountdown, 1000);
</script>
</body>
</html>
